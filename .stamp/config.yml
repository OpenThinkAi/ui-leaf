branches:
  main:
    required:
      - security
      - standards
      - product
    # required_checks run at `stamp merge` time against the merged tree (post-
    # merge) and roll the merge back if any non-zero. The set covers:
    #   typecheck — `tsc --noEmit` on the CLI package
    #   build     — root `bun run build` (pre-bundles React for the binary embed)
    #   test      — `bun test` across all workspaces
    #   smoke     — pre-merge binary+wrapper round-trip (AGT-202). Builds the
    #               host-platform binary into a tempdir, drives stdin-IPC mount
    #               and wrapper-via-source round-trips. Host-only; the post-
    #               publish `.github/workflows/smoke.yml` matrix keeps the
    #               cross-platform coverage as defense-in-depth.
    #   build-wrapper — `bun run build:wrapper` (tsup + DTS pass for the npm
    #               package), the same step publish.yml runs before `npm
    #               publish`. Smoke drives the wrapper from source, so without
    #               this a toolchain change that breaks tsup's DTS emit (e.g. a
    #               TypeScript major bump) could merge and only fail at publish.
    #               `build:binaries` (release job) is deliberately not gated:
    #               smoke already compiles the host-platform binary, and the
    #               full five-target cross-compile is too slow for every merge.
    required_checks:
      - name: typecheck
        run: bun run typecheck
      - name: build
        run: bun run build
      - name: test
        run: bun test
      - name: smoke
        run: bun run scripts/smoke-presubmit.ts
      - name: build-wrapper
        run: bun run build:wrapper
reviewers:
  security:
    prompt: .stamp/reviewers/security.md
  standards:
    prompt: .stamp/reviewers/standards.md
  product:
    prompt: .stamp/reviewers/product.md
